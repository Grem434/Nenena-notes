# Nenena Notes – Nginx (modo producción con HTTPS)
# Redirige todo HTTP a HTTPS y sirve el frontend compilado + API FastAPI

# --- Redirección HTTP → HTTPS ---
server {
  listen 80;
  server_name _;

  return 301 https://$host$request_uri;
}

# --- Servidor HTTPS principal ---
server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/localhost+1.pem;
  ssl_certificate_key /etc/nginx/certs/localhost+1-key.pem;

  # --- API (FastAPI) ---
  location /api/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Frontend (React compilado) ---
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
