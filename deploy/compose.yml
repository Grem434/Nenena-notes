# Nenena Notes – Docker Compose (versión final con montaje directo del frontend)
# Ejecutar desde la raíz del proyecto:
#   docker compose --env-file deploy\env\.env.dev -f deploy\compose.yml up -d --build

services:
  db:
    image: postgres:16
    container_name: nenena-db
    restart: unless-stopped
    networks:
      - nenena-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: C:/Users/davro/proyectos/nenena-notes-mvp-skeleton/apps/api
      dockerfile: C:/Users/davro/proyectos/nenena-notes-mvp-skeleton/deploy/docker/api.Dockerfile
    container_name: nenena-api
    restart: unless-stopped
    networks:
      - nenena-net
    env_file:
      - ./env/.env.dev
    depends_on:
      - db
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: nenena-nginx
    restart: unless-stopped
    networks:
      - nenena-net
    volumes:
      # configuración personalizada
      - C:/Users/davro/proyectos/nenena-notes-mvp-skeleton/deploy/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certificados SSL
      - C:/Users/davro/proyectos/nenena-notes-mvp-skeleton/deploy/docker/nginx/certs:/etc/nginx/certs:ro
      # build local del frontend
      - C:/Users/davro/proyectos/nenena-notes-mvp-skeleton/apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:

networks:
  nenena-net:
    driver: bridge
