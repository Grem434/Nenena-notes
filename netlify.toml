[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML sin cache fuerte (así siempre se trae la versión nueva)
[[headers]]
  for = "/index.html"
  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

# Service Worker siempre fresco
[[headers]]
  for = "/service-worker.js"
  [headers.values]
  Cache-Control = "no-cache"
  Service-Worker-Allowed = "/"

# Manifest: puede cambiar entre builds
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
  Cache-Control = "no-cache"

# Estáticos fingerprinted por Vite: cache fuerte
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Opcional: iconos/favicons
[[headers]]
  for = "/icons/*"
  [headers.values]
  Cache-Control = "public, max-age=604800"

# Seguridad básica
[[headers]]
  for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
